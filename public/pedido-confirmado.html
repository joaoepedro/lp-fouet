<!doctype html>
<html lang="pt-BR">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>Pedido confirmado | Fouet Studio</title>
        <!-- Fica sempre fora do Google, mesmo depois de publicado -->
        <meta name="robots" content="noindex, nofollow" />
        <meta name="theme-color" content="#4b2a06" />
        <link
            rel="icon"
            href="assets/img/favicon-32.png"
            sizes="32x32"
            type="image/png"
        />
        <link rel="stylesheet" href="css/reset.css" />
        <link rel="stylesheet" href="css/variables.css" />
        <link rel="stylesheet" href="css/style.css?v=2" />
        <script>
            document.documentElement.classList.add("js");
        </script>
        <script src="js/config.js" defer></script>
        <script src="js/utils.js" defer></script>
        <script src="js/tracking.js" defer></script>
        <script src="js/cardapio.js" defer></script>
        <script src="js/carrinho.js" defer></script>
        <script src="js/pedido-confirmado.js" defer></script>
        <script src="js/aviso-demo.js" defer></script>
    </head>
    <body>
        <a class="pular" href="#conteudo">Pular para o conteúdo</a>
        <svg width="0" height="0" style="position: absolute" aria-hidden="true">
            <symbol id="i-whats" viewBox="0 0 24 24">
                <path
                    fill="currentColor"
                    d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2Zm0 18.2a8.2 8.2 0 0 1-4.2-1.1l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2Zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8-.2-.1-.4-.1-.6.1l-.8 1c-.1.2-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.3-.4.2-.4.7-1.4.1-.2 0-.3 0-.4l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.7 11.8 11.8 0 0 0 4.5 4c1.7.7 2.3.8 3.2.6.5-.1 1.5-.6 1.7-1.2.2-.6.2-1.1.1-1.2l-.4-.2Z"
                />
            </symbol>
        </svg>
        <main id="conteudo" class="confirmado" tabindex="-1">
            <div class="confirmado__cartao">
                <img
                    src="assets/img/mascote-ok-220.webp"
                    width="220"
                    height="406"
                    alt=""
                />
                <h1 data-conf-titulo>Conferindo o pagamento…</h1>
                <p class="confirmado__texto" data-conf-texto>Só um instante.</p>
                <div class="confirmado__resumo" data-conf-resumo>
                    <h2>Pedido <span data-conf-numero></span></h2>
                    <ul role="list" data-conf-itens></ul>
                    <p class="confirmado__total">
                        Total <strong data-conf-total></strong>
                    </p>
                </div>
                <a
                    class="btn btn--whats"
                    href="https://wa.me/5516999990000"
                    target="_blank"
                    rel="noopener"
                    data-conf-whats
                    hidden
                    ><svg width="20" height="20" aria-hidden="true">
                        <use href="#i-whats" /></svg
                    >Enviar pedido no WhatsApp<span class="visually-hidden">
                        (abre em nova aba)</span
                    ></a
                >
                <a class="confirmado__voltar" href="index.html"
                    >Voltar para o cardápio</a
                >
            </div>
        </main>
    </body>
</html>
